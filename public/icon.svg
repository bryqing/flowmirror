<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="rgba(255,255,255,0.09)" stroke-width="2"/>
  <!-- 轨道环 -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="url(#ring)" stroke-width="14" opacity="0.9" transform="rotate(-24 256 256)"/>
  <!-- 黑洞警示点 -->
  <circle cx="352" cy="176" r="16" fill="#fb7185" filter="url(#glow)"/>
  <!-- 镜面核心 -->
  <circle cx="256" cy="256" r="62" fill="#09090b" stroke="#67e8f9" stroke-width="10" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="22" fill="#67e8f9"/>
</svg>
