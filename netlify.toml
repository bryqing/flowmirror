# ============================================================================
# FlowMirror · Netlify 部署配置
# 技术栈：Next.js 16 App Router（SSR / Route Handlers / Server Actions / SSE 流式）
# 参考：https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/
# ============================================================================

[build]
  # 构建命令：走 package.json 的 build 脚本（即 next build）
  command = "npm run build"

  # 发布目录必须指向 .next —— 构建完成后由 Next.js Runtime 接管，
  # 把 SSR 页面 / API 路由重新编排为 Netlify Functions 与静态资源。
  # ⚠️ 不要填 "out"：那是 next export 静态导出的目录，会直接丢掉 SSR 与所有 API 路由。
  publish = ".next"

[build.environment]
  # Next.js 16 要求 Node.js >= 20.9.0，显式固定为 22，
  # 避免 Netlify 默认 Node 版本过低导致构建中断。
  NODE_VERSION = "22"

# ----------------------------------------------------------------------------
# Next.js Runtime（OpenNext 适配器）
#
# 作用：自动为 SSR / ISR / Route Handlers / Server Actions 创建 Netlify Function，
#       为 Next.js Middleware 创建 Edge Function，并接管 next/image 走 Image CDN。
#
# 为什么显式声明：Netlify 一般会自动挂载该运行时，但本站点此前出现
#       「只发布了源码目录 → 全站 404」，说明框架未被正确识别、运行时未激活。
#       显式声明可确保每次构建必定挂载。
#
# 权衡：显式声明会「固定」适配器版本，不再跟随 Netlify 自动升级。
#       若希望恢复自动更新（推荐长期做法），删除下面 [[plugins]] 段，
#       并从 package.json 的 devDependencies 中移除 @netlify/plugin-nextjs 即可。
# ----------------------------------------------------------------------------
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ----------------------------------------------------------------------------
# Supabase 同源反向代理（解决国内直连被阻断）
#
# 背景：中国大陆网络直连 https://<ref>.supabase.co 会被阻断
#       （浏览器报 ERR_CONNECTION_CLOSED），手机端必须挂梯子才能登录/同步。
#
# ⚠️ 这里**故意没有** /api/supabase/* 的 [[redirects]] —— 不要加回来。
#
# 线上实测（jocular-pony-b41da7）三种方案的结论：
#   1) netlify.toml 原生代理（from="/api/supabase/*"、status=200、force=true）
#      → 跑到 Netlify 边缘代理后上游 fetch 直接失败：返回**空 body 的 text/plain 500**，
#        响应里既没有上游的 sb-* 标头，也不带 Next.js 运行时的
#        Cache-Status: "Next.js" 标记（对照 /api/nope 的 404 明确带该标记），
#        说明请求根本没到 Supabase，且错误无法从外部诊断。
#   2) next.config.ts 的 rewrites 指向外部 Supabase
#      → Netlify 会改写 Content-Encoding（PostHog 官方文档点名），压缩内容解码失败。
#   3) 两者并存还会互相遮蔽（原生规则优先级更高），排障时无法判断是谁在应答。
#
# 最终收敛为**单一实现**：src/app/api/supabase/[...path]/route.ts 的 Route Handler。
# 该路径与 /api/ai/* 同属 Netlify Functions，已确认可正常应答；且目标地址与
# 请求/响应标头完全可控，失败会返回结构化诊断信息，不再是黑盒 500。
#
# 若将来要改回边缘代理，请先在 Netlify 侧确认能读到代理失败日志，
# 并同时删除 Route Handler，避免两层并存。
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# ⚠️ 函数超时（部署后需留意）
#
# Netlify 同步函数默认执行上限为 10 秒（Pro 及以上可提到 26 秒）。
# 本项目 /api/ai/* 走 DeepSeek 推理模型，实测耗时 2~14 秒（冷启动更久），
# 因此这些路由有概率触发 504 / 「Task timed out」。
# 注意 /api/supabase/* 也是函数路由（代理转发），但它只做透传、耗时在百毫秒级，
# 一般不受超时影响。
#
# 若线上出现 AI 路由超时：
#   1. Netlify 控制台 → Site configuration → Functions → 把超时调到上限；
#   2. 或在构建日志 / Functions 面板确认运行时函数名后，按官方语法单独放宽。
#
# 注意：不要在页面路由上添加全站 catch-all redirect，会覆盖 Next.js Runtime
#       自身的路由与缓存规则，导致页面再次 404。
# ----------------------------------------------------------------------------
